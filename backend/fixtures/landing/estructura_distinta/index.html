<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huerta Viva — Verduras orgánicas a tu puerta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="col">
    <section id="contacto">
      <h2>Contacto</h2>
      <form id="form-contacto" novalidate>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="3"></textarea>
        <button type="submit">Enviar</button>
      </form>
      <p id="confirmacion" hidden>¡Gracias! Te responderemos pronto.</p>
    </section>
    <h1>Verduras orgánicas a tu puerta</h1>
    <p>Cajas semanales de productores locales.</p>
    <h2 id="servicios">Servicios</h2>
    <ul>
      <li>Caja semanal</li>
      <li>Caja familiar</li>
      <li>Pedido a medida</li>
    </ul>
    <footer>
      <p>Huerta Viva</p>
      <nav><a href="#servicios">Servicios</a> · <a href="#contacto">Contacto</a> · <a href="#contacto">Pedir ahora</a></nav>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
